name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/audook-apk-retrieval-djj6k1
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run android-sync

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to delivery branch
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/audook-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-delivery
          git rm -rf . > /dev/null
          cp /tmp/audook-debug.apk audook-debug.apk
          git add audook-debug.apk
          git commit -m "APK build from ${GITHUB_SHA}"
          git push origin apk-delivery --force
