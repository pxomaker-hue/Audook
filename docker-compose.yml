services:
  audook-nas:
    build: .
    image: audook-nas:latest
    container_name: audook-nas
    restart: unless-stopped
    networks:
      - audook-net
    ports:
      - "5000:5000"
    environment:
      # Optional shared secret protecting the whole API (recommended as soon as the
      # NAS is reachable by anything other than you). Set it in a .env file next to
      # this compose file (AUDOOK_API_TOKEN=a-long-random-string) or replace the
      # value below; leave empty to keep the API open on the LAN. Enter the same
      # value in the app (connection screen / Settings > Jeton d'accès).
      - AUDOOK_API_TOKEN=${AUDOOK_API_TOKEN:-}
      # Required unless you set AUDOOK_ALLOW_NO_AUTH=1 (the API refuses to start open).
      - AUDOOK_LIBRARY_ROOT=/audiobooks
    volumes:
      # Persists the NAS instance's own SQLite DB + cache (separate from the
      # desktop app's local DB). Point this at a real path on the OMV host.
      # The container runs as uid 1000 (not root): the host folder must be writable by
      # it (chown -R 1000:1000 <folder>). Migrating from an older image: it used to be
      # mounted on /root/.audook, same content, just chown it once.
      - /path/to/omv/appdata/audook/data:/home/audook/.audook
      # Read-only mount of the real audiobook folder on the NAS, scanned the
      # same way the desktop app scans local folders (app/local/scanner.py).
      - /path/to/omv/shares/Audiobooks:/audiobooks:ro

networks:
  audook-net:
    driver: bridge
